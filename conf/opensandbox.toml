# OpenSandbox Docker 配置
#
# 本文件基于官方 `opensandbox-server init-config --example docker` 生成示例收敛而来，
# 并改为当前环境优先使用阿里云镜像源，避免首次从 Docker Hub 拉取过慢。

[server]
host = "0.0.0.0"
port = 8080
log_level = "INFO"
max_sandbox_timeout_seconds = 86400

[renew_intent]
enabled = false
min_interval_seconds = 60
redis.enabled = false
redis.queue_key = "opensandbox:renew:intent"
redis.consumer_concurrency = 8

[runtime]
type = "docker"
execd_image = "sandbox-registry.cn-zhangjiakou.cr.aliyuncs.com/opensandbox/execd:v1.0.7"

[egress]
image = "sandbox-registry.cn-zhangjiakou.cr.aliyuncs.com/opensandbox/egress:v1.0.3"
mode = "dns"

[storage]
allowed_host_paths = []

[docker]
network_mode = "docker_default"
host_ip = "host.docker.internal"
drop_capabilities = [
  "AUDIT_WRITE",
  "MKNOD",
  "NET_ADMIN",
  "NET_RAW",
  "SYS_ADMIN",
  "SYS_MODULE",
  "SYS_PTRACE",
  "SYS_TIME",
  "SYS_TTY_CONFIG",
]
no_new_privileges = true
apparmor_profile = ""
pids_limit = 4096
seccomp_profile = ""

[ingress]
mode = "direct"
