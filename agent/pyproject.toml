[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fusion-agent"
version = "0.1.0"
description = "Fusion Agent package for LangGraph"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = { "agent" = "." }
packages = [
  "agent",
  "agent.cli",
  "agent.core",
  "agent.memory",
  "agent.runtime",
  "agent.services",
  "agent.services.http",
  "agent.services.mcp",
  "agent.services.a2a",
  "agent.tools",
  "agent.subagents",
]
