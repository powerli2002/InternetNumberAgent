    > ✅ **说明**：以上数据仅包含状态为 `'assigned'` 的 AS 编号，代表“活跃”或“已分配”的自治系统。

    ---

    ### ⚠️ 信息缺失与建议

    - **总活跃 AS 数量缺失**：当前 SQL 查询仅返回分组聚合后的前 10 名，未提供全局总计。
      - ✅ **建议下一步**：执行 `SELECT COUNT(*) FROM as_entity WHERE status = 'assigned';` 获取活跃 AS 总量。

    - **国家名称映射缺失**：部分国家使用 ISO 代码（如 PR、BM），非所有用户熟悉其全称。
      - ✅ **建议增强**：若需展示友好名称，可关联国家代码映射表（如 `country_code_map`）。

    ---

    ### 📊 补充分析（基于现有数据）

    - **美国主导地位显著**：US 占比远超其他国家之和，反映其互联网基础设施密度与商业生态规模。
    - **加勒比地区集中度高**：PR、BM、VG、BS、JM、VI、AG 均位于加勒比海区域，可能与离岸注册、金融或 CDN 节点部署有关。
    - **欧洲代表较少**：仅英国（GB）入榜，且数量较低，可能受统计口径或数据源覆盖影响。

    ---

    如需进一步分析（如趋势变化、ASN 类型分布、商业关系图谱等），请提供更详细字段或扩展查询条件。
