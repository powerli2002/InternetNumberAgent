    answer_preview=**什么是自治系统（AS）？**\n\n自治系统（Autonomous System，简称 AS）是互联网中由单一管理实体（如 ISP、云服务商、大型企业、大学或政府机构）控制的一组 IP 路由前缀集合。该实体为其网络制定统一、明确的路由策略，并通过边界网关协议（BGP）与其他自治系统交换路由信息。\n\
    \nAS 最初在 1982 年 RFC 827 中定义，其核心思想是：互联网由多个“平等”的自治系统组成，每个系统无论规模大小，在路由管理责任上地位相同。AS 通过唯一的 **自治系统号（ASN）** 标识，最初为 16 位（0–65535），后扩展为\
    \ 32 位（0–4294967295），由 IANA 分配给五大区域互联网注册机构（RIR），再由 RIR 分配给申请实体。\n\n---\n\n**按连接属性和流量角色，自治系统通常可分为以下四类：**\n\n1. **末端 AS（Stub\
    \ AS）**  \n   - 仅连接到一个上游 AS。\n   - 通常不承载穿越流量，仅收发自身网络的流量。\n   - 虽然路由策略可能与其上游一致，但仍可能因私有对等或安全隔离需求而独立编号。\n   - 典型例子：企业专网\n\
