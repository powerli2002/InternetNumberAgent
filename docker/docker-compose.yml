services:
  postgres:
    image: postgres:15
    container_name: fusion-postgres
    environment:
      POSTGRES_DB: fusionprocessing
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - ../mount/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d fusionprocessing"]
      interval: 5s
      timeout: 5s
      retries: 20

  loader:
    build:
      context: ..
      dockerfile: docker/Dockerfile.loader
    container_name: fusion-csv-loader
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /work
    environment:
      PYTHONPATH: /work
    volumes:
      - ..:/work
    command: ["bash", "-lc", "python scripts/load_all_csv.py --config conf/config.docker.yaml --root /work --date 2024-08-12 --ensure-core"]

  neo4j:
    image: neo4j:5
    container_name: fusion-neo4j
    environment:
      NEO4J_AUTH: neo4j/neo4j123 # 用户名/密码
    ports:
      - "7474:7474"  # 可视化界面
      - "7687:7687"  # 连接端口
    volumes:
      - ../mount/neo4j/data:/data
      - ../mount/neo4j/logs:/logs
      - ../mount/neo4j/import:/import
      - ../mount/neo4j/plugins:/plugins

  etcd:
    image: quay.io/coreos/etcd:v3.5.9
    container_name: fusion-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd
      -advertise-client-urls=http://0.0.0.0:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    ports:
      - "2379:2379"
    volumes:
      - ../mount/milvus/etcd:/etcd

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: fusion-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ../mount/milvus/minio:/minio_data

  milvus:
    image: milvusdb/milvus:v2.3.5
    container_name: fusion-milvus
    depends_on:
      - etcd
      - minio
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - ../mount/milvus/db:/var/lib/milvus
      - ../conf/milvus.yaml:/milvus/configs/milvus.yaml
      - ../mount/milvus/logs:/var/lib/milvus/logs
    command: ["milvus", "run", "standalone"]

  agent-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: fusion-agent-api
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../conf/.env
    environment:
      POSTGRES_URL: postgresql+psycopg2://admin:123456@postgres:5432/fusionprocessing
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: neo4j123
    ports:
      - "2025:2025"
    volumes:
      - ..:/work
    working_dir: /work
    command: ["bash", "-lc", "uvicorn agent.api_server:app --host 0.0.0.0 --port 2025"]
